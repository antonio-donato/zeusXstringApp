<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>TIMESTRING GENERATOR</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YHZ0XV6N9B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-YHZ0XV6N9B');
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #64b5f6, #8e24aa 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Roboto', sans-serif;
      margin: 0;
    }
    .banner-logo {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.85); /* bianco trasparente */
      border-radius: 18px 18px 0 0;
      padding: 1.1em 0 0.7em 0;
      margin-bottom: 0.5em;
    }

    .banner-logo img {
      width: 85%;
      max-width: 420px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 6px 28px rgba(80, 36, 101, 0.19);
      padding: 2.5em 2em 2em 2em;
      max-width: 370px;
      width: 100%;
      text-align: center;
      animation: floatIn 1s cubic-bezier(0.42,0,0.58,1);
      margin-top: 48px;
    }
    @keyframes floatIn {
      from { transform: translateY(80px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    label {
      display: block;
      margin-top: 1.1em;
      color: #8e24aa;
      font-weight: 500;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.2em;
      border: 1.5px solid #d1c4e9;
      border-radius: 10px;
      font-size: 1em;
      background: #f8f7fa;
      transition: border 0.2s;
      font-family: 'Roboto', sans-serif;
    }
    input:focus, select:focus {
      border: 1.5px solid #7c43bd;
      outline: none;
    }
    button {
      margin-top: 1.2em;
      width: 100%;
      padding: 0.7em;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #7c43bd 60%, #42a5f5);
      color: #fff;
      font-size: 1.08em;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(80, 36, 101, 0.10);
      letter-spacing: 0.05em;
      transition: box-shadow 0.18s, transform 0.18s, background 0.2s;
    }
    button:hover {
      background: linear-gradient(90deg,#42a5f5,#7c43bd 85%);
      box-shadow: 0 4px 16px rgba(80, 36, 101, 0.14);
      transform: translateY(-2px) scale(1.03);
    }
    #output {
      margin-top: 1.2em;
      padding: 1em 0.7em;
      border-radius: 10px;
      border: 1px solid #e1bee7;
      background: #ede7f6;
      min-height: 1.5em;
      color: #5c258d;
      font-size: 1.1em;
      font-weight: 500;
      word-break: break-all;
      letter-spacing: 0.01em;
      box-shadow: 0 1px 6px rgba(124,67,189,0.04);
    }
    .version-label {
      position: fixed;
      left: 16px;
      bottom: 16px;
      font-size: 0.97em;
      color: #fff;
      background: rgba(124,67,189,0.75);
      padding: 5px 16px;
      border-radius: 13px;
      box-shadow: 0 2px 12px rgba(124,67,189,0.14);
      z-index: 100;
      font-weight: 500;
      letter-spacing: 0.1em;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner-logo">
      <img src="logo-top.png" alt="TIMESTRING GENERATOR" />
    </div>
    <form onsubmit="event.preventDefault(); generateString();">
      <label for="duration">Durata (ore):</label>
      <input type="number" id="duration" min="0" step="0.5" required value="8" autofocus>
  
      <label for="start">Ora di inizio:</label>
      <input type="time" id="start" required value="09:00">
  
      <label for="end">Ora di fine:</label>
      <input type="time" id="end" required value="18:00">
  
      <label for="category">Categoria:</label>
      <select id="category" onchange="toggleSubcategory()">
        <option value="AVA">AVA</option>
        <option value="PK">PK</option>
        <option value="PAR">PAR</option>
        <option value="PP">PP</option>
      </select>
  
      <div id="subcategory-group">
        <label for="subcategory">Sotto-categoria:</label>
        <select id="subcategory">
          <option value="FERIE">FERIE</option>
          <option value="ROL">ROL</option>
          <option value="EX-FEST">EX-FEST</option>
          <option value="PAR">PAR</option>
        </select>
      </div>
  
  <button type="button" id="generate-copy-btn" onclick="generateAndCopy()">Genera Stringa e Copia negli appunti</button>
  <div id="output"></div>
    </form>
  </div>
  <div class="version-label">versione 2.0.7</div>
  <script>
    window.onload = function() {
      let durationInput = document.getElementById("duration");
      durationInput.focus();
      durationInput.select();
      // Ripristina valori salvati (cookie o localStorage)
      restoreSavedFields();
      // Toggle iniziale senza salvare (altrimenti sovrascrive i valori restaurati)
      toggleSubcategory(false);

      // Aggiungi listeners per salvare i campi appena vengono modificati
      try {
        const durationEl = document.getElementById('duration');
        const startEl = document.getElementById('start');
        const endEl = document.getElementById('end');
        const categoryEl = document.getElementById('category');
        const subcatEl = document.getElementById('subcategory');

        durationEl.addEventListener('input', e => saveField('duration', e.target.value));
        startEl.addEventListener('change', e => saveField('start', e.target.value));
        endEl.addEventListener('change', e => saveField('end', e.target.value));
        subcatEl.addEventListener('change', e => saveField('subcategory', e.target.value));
        categoryEl.addEventListener('change', e => { toggleSubcategory(true); });
      } catch(e) {
        // elementi non trovati: non fare nulla
      }
    };
    
    // Persistence helpers: prefer localStorage (reliable), fall back to cookies
    function setLocal(name, value) {
      try { localStorage.setItem(name, value); return true; } catch(e) { return false; }
    }
    function getLocal(name) {
      try { return localStorage.getItem(name); } catch(e) { return null; }
    }
    function removeLocal(name) {
      try { localStorage.removeItem(name); } catch(e) {}
    }

    function setCookie(name, value, days) {
      try {
        const expires = new Date(Date.now() + (days||365)*24*60*60*1000).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
        return true;
      } catch(e) { return false; }
    }
    function getCookie(name) {
      try {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        if(match) return decodeURIComponent(match[2]);
      } catch(e) {}
      return null;
    }

    function saveField(name, value) {
      const key = 'tz_' + name;
      // try localStorage first
      if(!setLocal(key, value)) {
        // fallback to cookie
        setCookie(key, value, 365);
      }
    }

    function restoreSavedFields() {
      const fields = ['duration','start','end','category','subcategory'];
      fields.forEach(f => {
        const key = 'tz_' + f;
        let v = getLocal(key);
        if(v === null) v = getCookie(key);
        if(v !== null && v !== 'null' && v !== '') {
          const el = document.getElementById(f);
          if(el) el.value = v;
        }
      });
    }
    function toggleSubcategory(save = true) {
      let category = document.getElementById("category").value;
      let subcategoryGroup = document.getElementById("subcategory-group");
      if(category === "AVA") {
        subcategoryGroup.style.display = "block";
      } else {
        subcategoryGroup.style.display = "none";
        document.getElementById("subcategory").value = ""; // Resetta il valore
        // salva lo stato della subcategory anche quando nascosta, solo se è una modifica utente
        if(save) saveField('subcategory', '');
      }
      // salva la categoria quando cambia (solo se richiesta)
      if(save) saveField('category', category);
    }
    function generateString() {
      let duration = document.getElementById("duration").value;
      let start = document.getElementById("start").value;
      let end = document.getElementById("end").value;
      let category = document.getElementById("category").value;
      let subcategory = document.getElementById("subcategory").value;
      if(!duration || !start || !end) {
        document.getElementById("output").innerText = "Compila tutti i campi!";
        return;
      }

      if (category === "AVA") {
        let subcategory = document.getElementById("subcategory").value;
        result = `${duration} ore - ${category} - ${subcategory} - ${start}-${end}`;
      } else {
        result = `${duration} ore - ${category} - ${start}-${end}`;
      }

      document.getElementById("output").innerText = result;
      // salva i campi correnti
      saveField('duration', duration);
      saveField('start', start);
      saveField('end', end);
      saveField('category', category);
      if(category === 'AVA') saveField('subcategory', subcategory);
    }
    function copyString() {
      let text = document.getElementById("output").innerText;
      if(text && text !== "Compila tutti i campi!") {
        return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
      }
      return Promise.resolve(false);
    }

    function generateAndCopy() {
      // Genera la stringa
      generateString();

      // Copia e mostra feedback sul bottone
      const btn = document.getElementById('generate-copy-btn');
      const originalText = btn.innerText;
      copyString().then(success => {
        if(success) {
          btn.innerText = "✔ Copiato!";
        } else {
          btn.innerText = "Errore copia";
        }
        setTimeout(() => { btn.innerText = originalText; }, 1400);
      });
    }
  </script>
</body>
</html>
